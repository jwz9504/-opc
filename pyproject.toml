[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-meeting"
version = "0.1.0"
description = "Governed LangGraph multi-agent meeting workflow"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
langgraph = ["langgraph>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "unit: pure unit tests",
  "contract: schema and node contracts",
  "integration: integration tests",
  "e2e: end-to-end tests",
  "live_model: tests requiring a real model",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
